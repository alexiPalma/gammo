name: Surgical Telegram Gifts patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply Telegram Gifts surgical patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch original plugin
        shell: python {0}
        run: |
          from pathlib import Path
          p = Path('plugin_delite_gift.py')
          s = p.read_text(encoding='utf-8')
          marker = '# SURGICAL TELEGRAM GIFTS PATCH 2026-09-04'
          if marker in s:
              raise SystemExit(0)

          s = s.replace('ORDERS_FILE = os.path.join(\n    PLUGIN_DIR,\n    "orders.json"\n)\n', 'ORDERS_FILE = os.path.join(\n    PLUGIN_DIR,\n    "orders.json"\n)\n\nLOTS_FILE = os.path.join(\n    PLUGIN_DIR,\n    "lots.json"\n)\n', 1)
          s = s.replace('_orders_lock = threading.RLock()\n\n_orders = {}\n', '_orders_lock = threading.RLock()\n\n_lots_lock = threading.RLock()\n\n_orders = {}\n\n_lots = {}\n\n_last_processed_messages = {}\n', 1)

          anchor = '\ndef update_order(\n'
          lot_funcs = '''\n\ndef load_lots():\n    global _lots\n    os.makedirs(PLUGIN_DIR, exist_ok=True)\n    if not os.path.exists(LOTS_FILE):\n        _lots = {}\n        return\n    try:\n        with open(LOTS_FILE, "r", encoding="utf-8") as file:\n            data = json.load(file)\n        _lots = data if isinstance(data, dict) else {}\n    except Exception:\n        logger.exception("Telegram Gifts: ошибка загрузки lots.json")\n        _lots = {}\n\n\ndef save_lots():\n    os.makedirs(PLUGIN_DIR, exist_ok=True)\n    temporary = LOTS_FILE + ".tmp"\n    with _lots_lock:\n        data = dict(_lots)\n    try:\n        with open(temporary, "w", encoding="utf-8") as file:\n            json.dump(data, file, ensure_ascii=False, indent=4)\n        os.replace(temporary, LOTS_FILE)\n    except Exception:\n        logger.exception("Telegram Gifts: ошибка сохранения lots.json")\n\n\ndef set_lot_binding(lot_id, gift_id, title="", description=""):\n    key = str(lot_id)\n    with _lots_lock:\n        _lots[key] = {\n            "lot_id": key,\n            "gift_id": int(gift_id),\n            "gift_name": GIFTS.get(int(gift_id), str(gift_id)),\n            "title": str(title or ""),\n            "description": str(description or ""),\n            "updated_at": time.time(),\n        }\n    save_lots()\n\n\ndef get_lot_binding(lot_id):\n    with _lots_lock:\n        item = _lots.get(str(lot_id))\n        return dict(item) if item else None\n\n\ndef extract_gift_id(text):\n    match = re.search(r"(?i)\\bID\\s*:\\s*(\\d{5,30})\\b", str(text or ""))\n    if not match:\n        return None\n    try:\n        gift_id = int(match.group(1))\n    except Exception:\n        return None\n    return gift_id if gift_id in GIFTS else None\n\n\ndef scan_profile_lots(c):\n    try:\n        lots = c.profile.get_lots()\n    except Exception:\n        logger.exception("Telegram Gifts: не удалось получить список лотов")\n        return\n    found = 0\n    for lot in lots or []:\n        lot_id = getattr(lot, "id", None)\n        if lot_id is None:\n            continue\n        title = getattr(lot, "description", None) or getattr(lot, "title", None) or ""\n        description = getattr(lot, "full_description", None) or ""\n        try:\n            fields = c.account.get_lot_fields(lot_id)\n            description = (getattr(fields, "description_ru", None) or getattr(fields, "full_description", None) or getattr(fields, "description", None) or getattr(fields, "description_en", None) or description)\n        except Exception:\n            pass\n        gift_id = extract_gift_id(description)\n        if gift_id is not None:\n            set_lot_binding(lot_id, gift_id, title, description)\n            found += 1\n    logger.info("Telegram Gifts: найдено привязанных лотов: %s", found)\n'''
          if anchor not in s: raise SystemExit('anchor update_order not found')
          s = s.replace(anchor, lot_funcs + anchor, 1)

          old = '    if not normalized_lot:\n        return None\n\n    # Сначала точное совпадение.'
          new = '    if not normalized_lot:\n        return None\n\n    gift_id_from_text = extract_gift_id(lot_title)\n    if gift_id_from_text is not None:\n        return (int(gift_id_from_text), GIFTS[int(gift_id_from_text)])\n\n    # Сначала точное совпадение.'
          if old not in s: raise SystemExit('find_gift anchor not found')
          s = s.replace(old, new, 1)

          old = '''        lot_title = str(\n            lot_title\n        ).strip()\n\n        gift = find_gift(\n            lot_title\n        )'''
          new = '''        lot_title = str(\n            lot_title\n        ).strip()\n\n        explicit_gift_id = extract_gift_id(\n            getattr(full_order, "full_description", None)\n            or getattr(full_order, "description", None)\n            or lot_title\n        )\n        if explicit_gift_id is not None:\n            gift = (int(explicit_gift_id), GIFTS[int(explicit_gift_id)])\n        else:\n            gift = find_gift(lot_title)'''
          if old not in s: raise SystemExit('new-order anchor not found')
          s = s.replace(old, new, 1)

          helper_anchor = '\n# ============================================================\n# NEW MESSAGE\n# ============================================================\n'
          helpers = '''\n\ndef _event_message(c, e):\n    msg = getattr(e, "message", None)\n    if msg is not None:\n        return msg\n    chat = getattr(e, "chat", None)\n    if chat is None:\n        return None\n    class _CompatMessage:\n        pass\n    out = _CompatMessage()\n    out.chat_id = getattr(chat, "id", None)\n    out.text = getattr(chat, "last_message_text", None)\n    out.last_message_type = getattr(chat, "last_message_type", None)\n    out.author_id = 0 if getattr(chat, "last_by_bot", False) else None\n    out.type = getattr(chat, "last_message_type", None) or MessageTypes.NON_SYSTEM\n    out.by_bot = getattr(chat, "last_by_bot", False)\n    return out\n\n\ndef _message_is_duplicate(chat_id, text):\n    now = time.time()\n    key = (str(chat_id), str(text).strip())\n    previous = _last_processed_messages.get(key)\n    _last_processed_messages[key] = now\n    if previous is not None and now - previous < 3:\n        return True\n    if len(_last_processed_messages) > 500:\n        cutoff = now - 30\n        for k, value in list(_last_processed_messages.items()):\n            if value < cutoff:\n                _last_processed_messages.pop(k, None)\n    return False\n'''
          if helper_anchor not in s: raise SystemExit('message anchor not found')
          s = s.replace(helper_anchor, helpers + helper_anchor, 1)
          s = s.replace('        msg = e.message\n', '        msg = _event_message(c, e)\n\n        if msg is None:\n            return\n', 1)
          s = s.replace('        text = (\n            msg.text\n            or ""\n        ).strip()\n\n        if not text:\n            return\n', '        text = (\n            msg.text\n            or ""\n        ).strip()\n\n        if not text:\n            return\n\n        if _message_is_duplicate(getattr(msg, "chat_id", None), text):\n            return\n', 1)

          s = s.replace('    load_orders()\n', '    load_orders()\n    load_lots()\n\n    try:\n        scan_profile_lots(c)\n    except Exception:\n        logger.exception("Telegram Gifts: ошибка сканирования лотов")\n', 1)

          stop_anchor = '''    def stop(\n        self\n    ):'''
          account_method = '''    async def get_account_info(self):\n        await self._ensure_client()\n        me = await self.client.get_me()\n        from telethon.tl.functions.payments import GetStarsStatusRequest\n        from telethon.tl.types import InputPeerSelf\n        status = await self.client(GetStarsStatusRequest(peer=InputPeerSelf()))\n        balance = getattr(getattr(status, "balance", None), "amount", None)\n        if balance is None:\n            balance = getattr(status, "balance", None)\n        return me, status, balance\n\n'''
          if stop_anchor not in s: raise SystemExit('worker stop anchor not found')
          s = s.replace(stop_anchor, account_method + stop_anchor, 1)

          panel_anchor = '\n# ============================================================\n# POST INIT\n# ============================================================\n'
          panel = '''\n\ndef _register_telegram_panel(c):\n    telegram = getattr(c, "telegram", None)\n    bot = getattr(telegram, "bot", None) if telegram is not None else None\n    if bot is None:\n        logger.warning("Telegram Gifts: Telegram-ПУ Cardinal не найден")\n        return\n    try:\n        add_commands = getattr(c, "add_telegram_commands", None)\n        if callable(add_commands):\n            add_commands(UUID, [("gift_account", "Telegram-аккаунт + Stars", True), ("gift_lots", "Привязанные лоты", True), ("gift_help", "Помощь Telegram Gifts", True)])\n    except Exception:\n        logger.exception("Telegram Gifts: не удалось зарегистрировать команды Telegram-ПУ")\n    try:\n        @bot.message_handler(commands=["gift_account"])\n        def _gift_account(message):\n            if not _worker:\n                bot.send_message(message.chat.id, "❌ Telegram Gifts worker ещё не запущен.")\n                return\n            bot.send_message(message.chat.id, "⏳ Получаю Telegram-аккаунт и баланс Stars...")\n            async def job():\n                try:\n                    me, _, stars = await _worker.get_account_info()\n                    username = getattr(me, "username", None)\n                    uname = "@" + username if username else "отсутствует"\n                    bot.send_message(message.chat.id, "🎁 Telegram Gifts — аккаунт\\n\\n" f"👤 Имя: {getattr(me, 'first_name', '') or '-'}\\n" f"🆔 ID: {me.id}\\n" f"🔗 Username: {uname}\\n" f"⭐ Stars: {stars if stars is not None else 'не удалось получить'}")\n                except Exception:\n                    logger.exception("Telegram Gifts: ошибка /gift_account")\n                    bot.send_message(message.chat.id, "❌ Не удалось получить данные Telegram-аккаунта.")\n            if _worker.loop:\n                asyncio.run_coroutine_threadsafe(job(), _worker.loop)\n\n        @bot.message_handler(commands=["gift_lots"])\n        def _gift_lots(message):\n            with _lots_lock:\n                items = list(_lots.values())\n            if not items:\n                bot.send_message(message.chat.id, "🎁 Привязанных лотов нет.\\n\\nВ подробном описании лота укажите ID:<gift_id>.")\n                return\n            lines = ["🎁 Привязанные лоты:", ""]\n            for item in sorted(items, key=lambda x: str(x.get("lot_id", ""))):\n                lines.append(f"• Лот ID: {item.get('lot_id')}\\n  Подарок: {item.get('gift_name')}\\n  Gift ID: {item.get('gift_id')}")\n            bot.send_message(message.chat.id, "\\n\\n".join(lines))\n\n        @bot.message_handler(commands=["gift_help"])\n        def _gift_help(message):\n            bot.send_message(message.chat.id, "🎁 Telegram Gifts\\n\\n/gift_account — аккаунт Telegram + баланс Stars\\n/gift_lots — привязанные лоты\\n/gift_help — помощь\\n\\nFunPay: @username → + → выдача.\\n!возврат — возврат до выдачи.")\n    except Exception:\n        logger.exception("Telegram Gifts: ошибка регистрации Telegram-ПУ обработчиков")\n'''
          if panel_anchor not in s: raise SystemExit('post-init anchor not found')
          s = s.replace(panel_anchor, panel + panel_anchor, 1)
          s = s.replace('    logger.info(\n        "Telegram Gifts: плагин успешно загружен."\n    )', '    _register_telegram_panel(c)\n\n    logger.info(\n        "Telegram Gifts: плагин успешно загружен."\n    )', 1)

          s = s.replace('BIND_TO_NEW_MESSAGE = [\n    msg_hook\n]\n', 'BIND_TO_NEW_MESSAGE = [\n    msg_hook\n]\n\nBIND_TO_LAST_CHAT_MESSAGE_CHANGED = [\n    msg_hook\n]\n', 1)
          s = s.rstrip() + '\n\n' + marker + '\n'
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin_delite_gift.py
          git diff --cached --quiet || git commit -m "apply Telegram Gifts surgical patch"
          git push