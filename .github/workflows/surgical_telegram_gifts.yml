name: Surgical Telegram Gifts patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply Telegram Gifts surgical patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch original plugin
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('plugin_delite_gift.py')
          s = p.read_text(encoding='utf-8')
          marker = '# SURGICAL TELEGRAM GIFTS PATCH 2026-09-04'
          if marker in s:
              raise SystemExit(0)

          # 1) Persistent lot bindings.
          s = s.replace(
              'ORDERS_FILE = os.path.join(\n    PLUGIN_DIR,\n    "orders.json"\n)\n',
              'ORDERS_FILE = os.path.join(\n    PLUGIN_DIR,\n    "orders.json"\n)\n\nLOTS_FILE = os.path.join(\n    PLUGIN_DIR,\n    "lots.json"\n)\n',
              1)
          s = s.replace(
              '_orders_lock = threading.RLock()\n\n_orders = {}\n',
              '_orders_lock = threading.RLock()\n\n_lots_lock = threading.RLock()\n\n_orders = {}\n\n_lots = {}\n\n_last_processed_messages = {}\n',
              1)

          # 2) Load/save lots without touching the original order persistence.
          anchor = '\ndef update_order(\n'
          lot_funcs = r'''

def load_lots():
    global _lots
    os.makedirs(PLUGIN_DIR, exist_ok=True)
    if not os.path.exists(LOTS_FILE):
        _lots = {}
        return
    try:
        with open(LOTS_FILE, "r", encoding="utf-8") as file:
            data = json.load(file)
        _lots = data if isinstance(data, dict) else {}
    except Exception:
        logger.exception("Telegram Gifts: ошибка загрузки lots.json")
        _lots = {}


def save_lots():
    os.makedirs(PLUGIN_DIR, exist_ok=True)
    temporary = LOTS_FILE + ".tmp"
    with _lots_lock:
        data = dict(_lots)
    try:
        with open(temporary, "w", encoding="utf-8") as file:
            json.dump(data, file, ensure_ascii=False, indent=4)
        os.replace(temporary, LOTS_FILE)
    except Exception:
        logger.exception("Telegram Gifts: ошибка сохранения lots.json")


def set_lot_binding(lot_id, gift_id, title="", description=""):
    key = str(lot_id)
    with _lots_lock:
        _lots[key] = {
            "lot_id": key,
            "gift_id": int(gift_id),
            "gift_name": GIFTS.get(int(gift_id), str(gift_id)),
            "title": str(title or ""),
            "description": str(description or ""),
            "updated_at": time.time(),
        }
    save_lots()


def get_lot_binding(lot_id):
    with _lots_lock:
        item = _lots.get(str(lot_id))
        return dict(item) if item else None


def extract_gift_id(text):
    match = re.search(r"(?i)\bID\s*:\s*(\d{5,30})\b", str(text or ""))
    if not match:
        return None
    try:
        gift_id = int(match.group(1))
    except Exception:
        return None
    return gift_id if gift_id in GIFTS else None


def scan_profile_lots(c):
    try:
        lots = c.profile.get_lots()
    except Exception:
        logger.exception("Telegram Gifts: не удалось получить список лотов")
        return
    found = 0
    for lot in lots or []:
        lot_id = getattr(lot, "id", None)
        if lot_id is None:
            continue
        title = getattr(lot, "description", None) or getattr(lot, "title", None) or ""
        description = getattr(lot, "full_description", None) or ""
        try:
            fields = c.account.get_lot_fields(lot_id)
            description = (
                getattr(fields, "description_ru", None)
                or getattr(fields, "full_description", None)
                or getattr(fields, "description", None)
                or getattr(fields, "description_en", None)
                or description
            )
        except Exception:
            pass
        gift_id = extract_gift_id(description)
        if gift_id is not None:
            set_lot_binding(lot_id, gift_id, title, description)
            found += 1
    logger.info("Telegram Gifts: найдено привязанных лотов: %s", found)
'''
          s = s.replace(anchor, lot_funcs + anchor, 1)

          # 3) ID:<gift_id> has priority over title matching.
          old = '''    if not normalized_lot:\n        return None\n\n    # Сначала точное совпадение.'''
          new = '''    if not normalized_lot:\n        return None\n\n    gift_id_from_text = extract_gift_id(lot_title)\n    if gift_id_from_text is not None:\n        return (int(gift_id_from_text), GIFTS[int(gift_id_from_text)])\n\n    # Сначала точное совпадение.'''
          if old not in s:
              raise SystemExit('find_gift anchor not found')
          s = s.replace(old, new, 1)

          # 4) More reliable full-description source in new-order flow.
          old = '''        lot_title = str(\n            lot_title\n        ).strip()\n\n        gift = find_gift(\n            lot_title\n        )'''
          new = '''        lot_title = str(\n            lot_title\n        ).strip()\n\n        # Prefer an explicit Gift ID from the complete lot/order description.\n        explicit_gift_id = extract_gift_id(\n            getattr(full_order, "full_description", None)\n            or getattr(full_order, "description", None)\n            or lot_title\n        )\n        if explicit_gift_id is not None:\n            gift = (int(explicit_gift_id), GIFTS[int(explicit_gift_id)])\n        else:\n            gift = find_gift(lot_title)'''
          if old not in s:
              raise SystemExit('new-order anchor not found')
          s = s.replace(old, new, 1)

          # 5) Generic event helpers + duplicate protection for old Cardinal hook.
          helper_anchor = '\n# ============================================================\n# NEW MESSAGE\n# ============================================================\n'
          helpers = r'''

def _event_message(c, e):
    msg = getattr(e, "message", None)
    if msg is not None:
        return msg
    chat = getattr(e, "chat", None)
    if chat is None:
        return None
    class _CompatMessage:
        pass
    out = _CompatMessage()
    out.chat_id = getattr(chat, "id", None)
    out.text = getattr(chat, "last_message_text", None)
    out.last_message_type = getattr(chat, "last_message_type", None)
    out.author_id = 0 if getattr(chat, "last_by_bot", False) else None
    out.type = getattr(chat, "last_message_type", None)
    out.by_bot = getattr(chat, "last_by_bot", False)
    return out


def _message_is_duplicate(chat_id, text):
    now = time.time()
    key = (str(chat_id), str(text).strip())
    previous = _last_processed_messages.get(key)
    _last_processed_messages[key] = now
    if previous is not None and now - previous < 3:
        return True
    if len(_last_processed_messages) > 500:
        cutoff = now - 30
        for k, value in list(_last_processed_messages.items()):
            if value < cutoff:
                _last_processed_messages.pop(k, None)
    return False
'''
          s = s.replace(helper_anchor, helpers + helper_anchor, 1)

          # 6) Make existing msg_hook consume both NewMessageEvent and old chat-change event.
          s = s.replace('        msg = e.message\n', '        msg = _event_message(c, e)\n\n        if msg is None:\n            return\n', 1)
          s = s.replace('        text = (\n            msg.text\n            or ""\n        ).strip()\n\n        if not text:\n            return\n', '        text = (\n            msg.text\n            or ""\n        ).strip()\n\n        if not text:\n            return\n\n        if _message_is_duplicate(getattr(msg, "chat_id", None), text):\n            return\n', 1)

          # 7) Load lots at startup and scan current profile.
          s = s.replace('    load_orders()\n', '    load_orders()\n    load_lots()\n\n    try:\n        scan_profile_lots(c)\n    except Exception:\n        logger.exception("Telegram Gifts: ошибка сканирования лотов")\n', 1)

          # 8) Add Telegram-panel worker method before stop().
          stop_anchor = '''    def stop(\n        self\n    ):'''
          account_method = r'''
    async def get_account_info(self):
        await self._ensure_client()
        me = await self.client.get_me()
        from telethon.tl.functions.payments import GetStarsStatusRequest
        from telethon.tl.types import InputPeerSelf
        status = await self.client(GetStarsStatusRequest(peer=InputPeerSelf()))
        balance = getattr(getattr(status, "balance", None), "amount", None)
        if balance is None:
            balance = getattr(status, "balance", None)
        return me, status, balance

'''
          if stop_anchor not in s:
              raise SystemExit('worker stop anchor not found')
          s = s.replace(stop_anchor, account_method + stop_anchor, 1)

          # 9) Telegram panel commands, guarded so Cardinal versions without a panel keep working.
          panel_anchor = '\n# ============================================================\n# POST INIT\n# ============================================================\n'
          panel = r'''
def _register_telegram_panel(c):
    telegram = getattr(c, "telegram", None)
    bot = getattr(telegram, "bot", None) if telegram is not None else None
    if bot is None:
        logger.warning("Telegram Gifts: Telegram-ПУ Cardinal не найден")
        return
    try:
        add_commands = getattr(c, "add_telegram_commands", None)
        if callable(add_commands):
            add_commands(UUID, [
                ("gift_account", "Telegram-аккаунт + Stars", True),
                ("gift_lots", "Привязанные лоты", True),
                ("gift_help", "Помощь Telegram Gifts", True),
            ])
    except Exception:
        logger.exception("Telegram Gifts: не удалось зарегистрировать команды Telegram-ПУ")

    try:
        @bot.message_handler(commands=["gift_account"])
        def _gift_account(message):
            if not _worker:
                bot.send_message(message.chat.id, "❌ Telegram Gifts worker ещё не запущен.")
                return
            bot.send_message(message.chat.id, "⏳ Получаю Telegram-аккаунт и баланс Stars...")
            async def job():
                try:
                    me, _, stars = await _worker.get_account_info()
                    username = getattr(me, "username", None)
                    uname = "@" + username if username else "отсутствует"
                    bot.send_message(
                        message.chat.id,
                        "🎁 Telegram Gifts — аккаунт\n\n"
                        f"👤 Имя: {getattr(me, 'first_name', '') or '-'}\n"
                        f"🆔 ID: {me.id}\n"
                        f"🔗 Username: {uname}\n"
                        f"⭐ Stars: {stars if stars is not None else 'не удалось получить'}"
                    )
                except Exception as exc:
                    logger.exception("Telegram Gifts: ошибка /gift_account")
                    bot.send_message(message.chat.id, "❌ Не удалось получить данные Telegram-аккаунта.")
            if _worker.loop:
                asyncio.run_coroutine_threadsafe(job(), _worker.loop)

        @bot.message_handler(commands=["gift_lots"])
        def _gift_lots(message):
            with _lots_lock:
                items = list(_lots.values())
            if not items:
                bot.send_message(message.chat.id, "🎁 Привязанных лотов нет.\n\nВ подробном описании лота укажите ID:<gift_id>.")
                return
            lines = ["🎁 Привязанные лоты:", ""]
            for item in sorted(items, key=lambda x: str(x.get("lot_id", ""))):
                lines.append(
                    f"• Лот ID: {item.get('lot_id')}\n"
                    f"  Подарок: {item.get('gift_name')}\n"
                    f"  Gift ID: {item.get('gift_id')}"
                )
            bot.send_message(message.chat.id, "\n\n".join(lines))

        @bot.message_handler(commands=["gift_help"])
        def _gift_help(message):
            bot.send_message(
                message.chat.id,
                "🎁 Telegram Gifts\n\n"
                "/gift_account — аккаунт Telegram + Stars\n"
                "/gift_lots — привязанные лоты\n"
                "/gift_help — помощь\n\n"
                "FunPay: @username → + → выдача.\n"
                "!возврат — возврат до выдачи."
            )
    except Exception:
        logger.exception("Telegram Gifts: ошибка регистрации Telegram-ПУ обработчиков")

'''
          if panel_anchor not in s:
              raise SystemExit('post-init anchor not found')
          s = s.replace(panel_anchor, panel + panel_anchor, 1)
          s = s.replace('    logger.info(\n        "Telegram Gifts: плагин успешно загружен."\n    )', '    _register_telegram_panel(c)\n\n    logger.info(\n        "Telegram Gifts: плагин успешно загружен."\n    )', 1)

          # 10) Bind old LastChatMessageChangedEvent in addition to normal messages.
          s = s.replace('BIND_TO_NEW_MESSAGE = [\n    msg_hook\n]\n', 'BIND_TO_NEW_MESSAGE = [\n    msg_hook\n]\n\nBIND_TO_LAST_CHAT_MESSAGE_CHANGED = [\n    msg_hook\n]\n', 1)

          # Marker is deliberately near the end and keeps the original file otherwise intact.
          s = s.rstrip() + '\n\n' + marker + '\n'
          p.write_text(s, encoding='utf-8')
          print('patched', p, 'bytes=', p.stat().st_size)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin_delite_gift.py
          git diff --cached --quiet || git commit -m "apply Telegram Gifts surgical patch"
          git push