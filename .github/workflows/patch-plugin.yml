name: Apply Telegram Gifts fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!startsWith(github.event.head_commit.message, 'Apply Telegram Gifts fixes')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch plugin surgically
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('plugin_delite_gift.py')
          s = p.read_text(encoding='utf-8')
          marker = '# === TELEGRAM GIFTS SURGICAL EXTENSION ==='
          if marker in s:
              print('Extension already present; nothing to do.')
              raise SystemExit(0)
          extension = r'''

# === TELEGRAM GIFTS SURGICAL EXTENSION ===
# Дополнение к исходной версии плагина. Исходная механика не заменяется.

LOT_BIND_FILE = os.path.join(PLUGIN_DIR, "lots.json")


def _tg_load_lot_bindings():
    try:
        os.makedirs(PLUGIN_DIR, exist_ok=True)
        if not os.path.exists(LOT_BIND_FILE):
            return {}
        with open(LOT_BIND_FILE, "r", encoding="utf-8") as f:
            data = json.load(f)
        return data if isinstance(data, dict) else {}
    except Exception:
        logger.exception("Telegram Gifts: ошибка загрузки lots.json")
        return {}


def _tg_save_lot_bindings(data):
    try:
        os.makedirs(PLUGIN_DIR, exist_ok=True)
        tmp = LOT_BIND_FILE + ".tmp"
        with open(tmp, "w", encoding="utf-8") as f:
            json.dump(data, f, ensure_ascii=False, indent=4)
        os.replace(tmp, LOT_BIND_FILE)
    except Exception:
        logger.exception("Telegram Gifts: ошибка сохранения lots.json")


def _tg_extract_gift_id(text):
    if not text:
        return None
    m = re.search(r"(?:^|[^A-Za-zА-Яа-я])ID\s*:\s*(\d{5,25})(?:$|[^0-9])", str(text), re.I)
    if not m:
        return None
    try:
        gift_id = int(m.group(1))
    except Exception:
        return None
    return gift_id if gift_id in GIFTS else None


def _tg_order_text_candidates(order):
    values = []
    for name in ("description", "full_description", "short_description", "title", "lot_title", "lot_description", "comment", "fields"):
        try:
            value = getattr(order, name, None)
        except Exception:
            value = None
        if value:
            values.append(str(value))
    try:
        values.append(str(order))
    except Exception:
        pass
    return values


def _tg_detect_gift_for_order(full_order, event_order=None):
    for obj in (full_order, event_order):
        if obj is None:
            continue
        for text in _tg_order_text_candidates(obj):
            gift_id = _tg_extract_gift_id(text)
            if gift_id is not None:
                return gift_id, GIFTS[gift_id]
    for obj in (full_order, event_order):
        if obj is None:
            continue
        for name in ("title", "short_description", "description"):
            try:
                value = getattr(obj, name, None)
            except Exception:
                value = None
            gift = find_gift(value)
            if gift:
                return gift
    return None


def _tg_bind_lot_from_order(full_order, event_order=None):
    bindings = _tg_load_lot_bindings()
    lot_id = None
    for obj in (full_order, event_order):
        if obj is None:
            continue
        for name in ("lot_id", "lotId", "offer_id", "offerId"):
            try:
                value = getattr(obj, name, None)
            except Exception:
                value = None
            if value:
                lot_id = str(value)
                break
        if lot_id:
            break
    gift = _tg_detect_gift_for_order(full_order, event_order)
    if not gift:
        return None
    gift_id, gift_name = gift
    if lot_id:
        bindings[lot_id] = {"lot_id": lot_id, "gift_id": int(gift_id), "gift_name": gift_name, "updated_at": time.time()}
        _tg_save_lot_bindings(bindings)
    return gift


_tg_original_bind_to_new_order = bind_to_new_order


def bind_to_new_order(c, e):
    try:
        full_order = None
        try:
            full_order = c.account.get_order(e.order.id)
        except Exception:
            full_order = getattr(e, "order", None)
        _tg_bind_lot_from_order(full_order, getattr(e, "order", None))
    except Exception:
        logger.exception("Telegram Gifts: ошибка автопривязки лота")
    return _tg_original_bind_to_new_order(c, e)


async def _tg_account_text(worker):
    await worker._ensure_client()
    me = await worker.client.get_me()
    username = getattr(me, "username", None)
    name = " ".join(x for x in (getattr(me, "first_name", None), getattr(me, "last_name", None)) if x) or "—"
    stars = "не удалось получить"
    try:
        from telethon.tl.functions.payments import GetStarsStatusRequest
        result = await worker.client(GetStarsStatusRequest("me"))
        balance = getattr(result, "balance", None)
        amount = getattr(balance, "amount", balance)
        stars = str(amount if amount is not None else 0)
    except Exception as exc:
        logger.warning("Telegram Gifts: не удалось получить Stars: %s", exc)
    return ("📱 Telegram аккаунт\n\n" f"Имя: {name}\n" f"Username: @{username if username else 'нет'}\n" f"ID: {getattr(me, 'id', '—')}\n" f"Premium: {'да' if getattr(me, 'premium', False) else 'нет'}\n" f"⭐ Stars: {stars}")


def _tg_panel_run(chat_id, command):
    if _worker is None or _worker.loop is None:
        send_funpay_message(chat_id, "❌ Telegram worker ещё не запущен.")
        return
    async def job():
        try:
            if command == "account":
                return await _tg_account_text(_worker)
            return "❌ Неизвестная команда панели."
        except Exception as exc:
            logger.exception("Telegram Gifts: ошибка Telegram-панели")
            return f"❌ Не удалось получить данные Telegram: {exc}"
    try:
        future = asyncio.run_coroutine_threadsafe(job(), _worker.loop)
        send_funpay_message(chat_id, future.result(timeout=30))
    except Exception as exc:
        logger.exception("Telegram Gifts: ошибка панели")
        send_funpay_message(chat_id, f"❌ Ошибка панели: {exc}")


def _tg_panel_lots(chat_id):
    bindings = _tg_load_lot_bindings()
    if not bindings:
        send_funpay_message(chat_id, "📦 Привязанных лотов пока нет.\n\nДобавьте ID:<gift_id> в описание лота и сделайте новую покупку.")
        return
    lines = ["📦 Привязанные лоты:\n"]
    for lot_id, item in bindings.items():
        lines.append(f"• Лот {lot_id} → {item.get('gift_name', 'неизвестно')} (ID: {item.get('gift_id')})")
    send_funpay_message(chat_id, "\n".join(lines))


def _tg_panel_help(chat_id):
    send_funpay_message(chat_id, "🛠 Telegram Gifts — панель\n\n/gift_account — аккаунт Telegram и Stars\n/gift_lots — список автоматически привязанных лотов\n/gift_help — эта справка\n\nДля автоматической привязки указывайте в описании лота:\nID:<gift_id>")


_tg_original_msg_hook = msg_hook


def msg_hook(c, e):
    try:
        msg = getattr(e, "message", None)
        text = (getattr(msg, "text", None) or "").strip() if msg else ""
        author_id = getattr(msg, "author_id", None) if msg else None
        own_id = getattr(c.account, "id", None)
        if text.startswith("/gift_") and (own_id is None or author_id == own_id):
            command = text.split()[0].lower()
            chat_id = getattr(msg, "chat_id", None)
            if command == "/gift_account":
                _tg_panel_run(chat_id, "account")
                return
            if command == "/gift_lots":
                _tg_panel_lots(chat_id)
                return
            if command == "/gift_help":
                _tg_panel_help(chat_id)
                return
    except Exception:
        logger.exception("Telegram Gifts: ошибка обработки команды панели")
    return _tg_original_msg_hook(c, e)


def _tg_last_chat_message_hook(c, e):
    try:
        chat = getattr(e, "chat", None)
        if chat is None or getattr(chat, "last_by_bot", False):
            return
        text = (getattr(chat, "last_message_text", None) or "").strip()
        if not text:
            return
        class _CompatMessage: pass
        m = _CompatMessage()
        m.text = text
        m.chat_id = getattr(chat, "id", None)
        m.author_id = getattr(chat, "user_id", None)
        m.type = MessageTypes.NON_SYSTEM
        m.by_bot = False
        class _CompatEvent: pass
        ce = _CompatEvent()
        ce.message = m
        return msg_hook(c, ce)
    except Exception:
        logger.exception("Telegram Gifts: ошибка совместимого message hook")


BIND_TO_NEW_ORDER = [bind_to_new_order]
BIND_TO_NEW_MESSAGE = [msg_hook]
BIND_TO_LAST_CHAT_MESSAGE_CHANGED = [_tg_last_chat_message_hook]
'''
          p.write_text(s + extension, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin_delite_gift.py .github/workflows/patch-plugin.yml
          git rm .github/workflows/patch-plugin.yml
          git commit -m "Apply Telegram Gifts fixes without removing original mechanics"
          git push
