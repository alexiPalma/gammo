name: Apply full Telegram Gifts fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch
        run: |
          python fix_plugin.py
          rm -f fix_plugin.py
          rm -f .github/workflows/apply-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin_delite_gift.py fix_plugin.py .github/workflows/apply-fix.yml
          git commit -m 'fix: restore complete Telegram Gifts plugin' || exit 0
          git push
